<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITAUES | Inicio de sesión</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="contenedor-login">

        <section class="panel-informacion">
            <div class="marca">
                <div class="logo">C</div>
                <span>CITAUES</span>
            </div>

            <div class="contenido-informacion">
                <h1>Bienvenido a CITAUES</h1>

                <p>
                    Sistema de Gestión de Reservas de Citas
                    para Servicios Universitarios.
                </p>

                <div class="mensaje">
                    Organiza tus citas universitarias
                    de manera sencilla, rápida y segura.
                </div>
            </div>

            <footer>
                Universidad de El Salvador
            </footer>
        </section>

        <section class="panel-formulario">

            <div class="formulario">

                <h2>Iniciar sesión</h2>

                <p class="subtitulo">
                    Ingresa tus datos para continuar.
                </p>

                <form id="formLogin">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="ejemplo@ues.edu.sv"
                        required
                    >

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                    <button type="submit">
                        Ingresar al sistema
                    </button>

                </form>

                <p class="nota">
                    Plataforma de servicios universitarios
                </p>

            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
